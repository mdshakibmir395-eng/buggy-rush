<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buggy Rush 3D</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #111;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #fff;
    }
    #ui {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0, 0, 0, 0.85);
      border: 2px solid #e74c3c;
      padding: 30px;
      border-radius: 12px;
      text-align: center;
      width: 340px;
      z-index: 10;
      box-shadow: 0 0 20px rgba(231, 76, 60, 0.4);
    }
    input, select, button {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      background: #222;
      border: 1px solid #444;
      color: #fff;
      border-radius: 6px;
      font-size: 16px;
      box-sizing: border-box;
    }
    button {
      background: #e74c3c;
      border: none;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }
    button:hover { background: #c0392b; }
    #hud {
      position: absolute;
      top: 15px;
      left: 15px;
      z-index: 5;
      font-size: 18px;
      font-weight: bold;
      background: rgba(0,0,0,0.6);
      padding: 10px 20px;
      border-radius: 8px;
      display: none;
    }
    #boostBar {
      width: 150px;
      height: 12px;
      background: #333;
      border-radius: 6px;
      overflow: hidden;
      margin-top: 5px;
    }
    #boostFill {
      width: 100%;
      height: 100%;
      background: #f39c12;
      transition: width 0.1s;
    }
    .player-list { text-align: left; margin: 10px 0; max-height: 120px; overflow-y: auto; background: #1a1a1a; padding: 8px; border-radius: 6px; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <!-- UI Menu -->
  <div id="ui">
    <h2>🏎️ Buggy Rush 3D</h2>
    <div id="join-screen">
      <input type="text" id="nameInput" placeholder="আপনার নাম লিখুন" maxlength="12" value="Racer">
      <select id="chSelect">
        <option value="0">লাল বাগি (Red)</option>
        <option value="1">নীল বাগি (Blue)</option>
        <option value="2">সবুজ বাগি (Green)</option>
        <option value="3">হলুদ বাগি (Yellow)</option>
      </select>
      <button onclick="joinGame()">লবিতে জয়েন করুন</button>
      <div id="errMsg" style="color: #e74c3c; margin-top: 5px;"></div>
    </div>

    <div id="lobby-screen" style="display:none;">
      <h3>লবি (Lobby)</h3>
      <div class="player-list" id="playerList">খেলোয়াড়ের অপেক্ষায়...</div>
