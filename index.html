<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buggy Rush 3D</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #111111;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #ffffff;
        }
        #ui {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.85);
            border: 2px solid #00ffc6;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            z-index: 10;
            box-shadow: 0 0 20px rgba(0, 255, 198, 0.4);
        }
        input, select, button {
            width: 100%;
            margin: 10px 0;
            padding: 12px;
            background: #222222;
            border: 2px solid #00ffc6;
            color: #ffffff;
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box;
        }
        button {
            background: #00ffc6;
            color: #000000;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
        button:hover {
            background: #00b38b;
        }
    </style>
</head>
<body>

    <div id="ui">
        <h2>Buggy Rush 3D</h2>
        <input type="text" id="pname" placeholder="আপনার নাম লিখুন">
        <select id="gameMode">
            <option value="single">একা খেলুন (Single Player)</option>
            <option value="multi">বন্ধুর সাথে খেলুন (Multiplayer)</option>
        </select>
        <button onclick="startGame()">গেম শুরু করুন</button>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        let gameStarted = false;
        let playerName = '';
        let mode = 'single';
        let carY = canvas.height - 150;
        let obstacles = [];
        let score = 0;

        function startGame() {
            playerName = document.getElementById('pname').value || 'প্লেয়ার';
            mode = document.getElementById('gameMode').value;
            document.getElementById('ui').style.display = 'none';
            gameStarted = true;
            loop();
        }

        window.addEventListener('keydown', (e) => {
            if (!gameStarted) return;
            if (e.key === 'ArrowLeft' && carY > 50) carY -= 30;
            if (e.key === 'ArrowRight' && carY < canvas.height - 100) carY += 30;
        });

        function loop() {
            ctx.fillStyle = '#222';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // রোড ড্র
            ctx.fillStyle = '#444';
            ctx.fillRect(canvas.width / 2 - 150, 0, 300, canvas.height);

            // কার ড্র
            ctx.fillStyle = '#00ffc6';
            ctx.fillRect(canvas.width / 2 - 25, carY, 50, 90);

            // স্কোর
            ctx.fillStyle = '#fff';
            ctx.font = '20px Arial';
            ctx.fillText(`নাম: ${playerName} | মোড: ${mode === 'single' ? 'একা' : 'মাল্টিপ্লেয়ার'} | স্কোর: ${score}`, 20, 40);

            score++;
            requestAnimationFrame(loop);
        }
    </script>
</body>
</html>
